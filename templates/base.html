<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndyOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }

        nav {
            background-color: #1a1d27;
            border-bottom: 1px solid #2a2d3e;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4f9eff;
            text-decoration: none;
            margin-right: 3rem;
        }

        .nav-brand span {
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #9099b0;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            background-color: #2a2d3e;
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-user {
            font-size: 0.82rem;
            color: #9099b0;
        }

        .btn-logout {
            background-color: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            padding: 0.3rem 0.9rem;
            border-radius: 6px;
            font-size: 0.82rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: #ff6b6b;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background-color: #1a1d27;
            border: 1px solid #2a2d3e;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #9099b0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #4f9eff;
            color: #ffffff;
        }

        .btn-primary:hover { background-color: #3a8aef; }

        .btn-danger {
            background-color: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .btn-danger:hover {
            background-color: #ff6b6b;
            color: #ffffff;
        }

        .btn-success {
            background-color: transparent;
            color: #51cf66;
            border: 1px solid #51cf66;
        }

        .btn-success:hover {
            background-color: #51cf66;
            color: #ffffff;
        }

        .btn-sm {
            padding: 0.25rem 0.7rem;
            font-size: 0.78rem;
        }

        .alert {
            padding: 1rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .alert-danger {
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .alert-warning {
            background-color: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            font-size: 0.85rem;
            color: #9099b0;
            margin-bottom: 0.4rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.6rem 0.9rem;
            background-color: #0f1117;
            border: 1px solid #2a2d3e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4f9eff;
        }

        .progress-bar-bg {
            background-color: #2a2d3e;
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            margin-top: 0.4rem;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.3s;
        }

        .bar-green  { background-color: #51cf66; }
        .bar-yellow { background-color: #fcc419; }
        .bar-red    { background-color: #ff6b6b; }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .badge-high {
            background-color: rgba(255,107,107,0.2);
            color: #ff6b6b;
        }
        .badge-medium {
            background-color: rgba(252,196,25,0.2);
            color: #fcc419;
        }
        .badge-low {
            background-color: rgba(81,207,102,0.2);
            color: #51cf66;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th {
            text-align: left;
            padding: 0.6rem 0.8rem;
            color: #9099b0;
            font-weight: 600;
            border-bottom: 1px solid #2a2d3e;
        }

        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #1e2130;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td      { background-color: #1e2130; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-box {
            background-color: #1a1d27;
            border: 1px solid #2a2d3e;
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
        }

        .stat-label {
            font-size: 0.78rem;
            color: #9099b0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0.3rem;
        }

        .stat-sub {
            font-size: 0.78rem;
            color: #9099b0;
            margin-top: 0.2rem;
        }

        .color-blue   { color: #4f9eff; }
        .color-green  { color: #51cf66; }
        .color-red    { color: #ff6b6b; }
        .color-yellow { color: #fcc419; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title    { font-size: 1.6rem; font-weight: 700; }

        .page-subtitle {
            font-size: 0.85rem;
            color: #9099b0;
            margin-top: 0.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #9099b0;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 {
                grid-template-columns: 1fr;
            }
            .container  { padding: 1rem; }
            .nav-links  { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="/" class="nav-brand">Andy<span>OS</span></a>
            <ul class="nav-links">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/add">+ Inventory</a></li>
                <li><a href="/add-expense">+ Expense</a></li>
                <li><a href="/add-reminder">+ Reminder</a></li>
                <li><a href="/analytics">📊 Analytics</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <span class="nav-user">
                👤 {{ session.get("username", "") }}
            </span>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
